name: 🚀 Despliegue Automático a AWS (energreen.servigest.online)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Compilar y Desplegar en AWS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📦 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔨 Compilar producción (Vite build)
        run: |
          npm ci
          npm run build

      - name: 🚀 Sincronizar archivos a AWS CloudPanel
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          source: "dist/*"
          target: "/tmp/energreen_deploy"
          strip_components: 1

      - name: 🔄 Mover archivos y actualizar permisos en servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script: |
            sudo cp -r /tmp/energreen_deploy/* /home/energreen/htdocs/energreen.servigest.online/
            sudo chown -R energreen:energreen /home/energreen/htdocs/energreen.servigest.online/
            sudo chmod -R 755 /home/energreen/htdocs/energreen.servigest.online/
            rm -rf /tmp/energreen_deploy
            echo "✅ ¡EnerGreen desplegado exitosamente en energreen.servigest.online!"
